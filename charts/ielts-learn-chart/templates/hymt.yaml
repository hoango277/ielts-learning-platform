{{- if .Values.hymt.enabled }}
{{- $model := printf "/models/%s" .Values.hymt.model.file }}
{{- if not .Values.hymt.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ielts.hymt.fullname" . }}-models
  labels:
    {{- include "ielts.hymt.labels" . | nindent 4 }}
  annotations:
    # Giữ model đã tải (~1,1 GB) khi gỡ chart
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.hymt.persistence.accessModes | nindent 4 }}
  {{- with .Values.hymt.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.hymt.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ielts.hymt.fullname" . }}
  labels:
    {{- include "ielts.hymt.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ielts.hymt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ielts.hymt.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.hymt.podSecurityContext | nindent 8 }}
      initContainers:
        # Tải model lần đầu (tải tiếp được nếu đứt mạng); bỏ qua nếu đã có
        - name: download-model
          image: {{ .Values.hymt.downloader.image }}
          securityContext:
            {{- toYaml .Values.hymt.securityContext | nindent 12 }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              f={{ $model | quote }}
              if [ -s "$f" ]; then echo "Model đã có: $f"; exit 0; fi
              echo "Đang tải model Hy-MT…"
              curl -fL --retry 5 --retry-delay 5 -C - -o "$f.part" {{ .Values.hymt.model.url | quote }}
              mv "$f.part" "$f"
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: "{{ .Values.hymt.image.repository }}:{{ .Values.hymt.image.tag }}"
          imagePullPolicy: {{ .Values.hymt.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.hymt.securityContext | nindent 12 }}
          args:
            - -m
            - {{ $model | quote }}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --alias
            - {{ .Values.hymt.model.alias | quote }}
            {{- range .Values.hymt.args }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.hymt.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.hymt.persistence.existingClaim | default (printf "%s-models" (include "ielts.hymt.fullname" .)) }}
      {{- with .Values.hymt.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hymt.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hymt.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ielts.hymt.fullname" . }}
  labels:
    {{- include "ielts.hymt.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.hymt.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ielts.hymt.selectorLabels" . | nindent 4 }}
{{- end }}
