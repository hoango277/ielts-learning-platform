{{- if and (not .Values.vapid.existingSecret) .Values.vapid.publicKey .Values.vapid.privateKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ielts.fullname" . }}-vapid
  labels:
    {{- include "ielts.labels" . | nindent 4 }}
type: Opaque
stringData:
  VAPID_PUBLIC_KEY: {{ .Values.vapid.publicKey | quote }}
  VAPID_PRIVATE_KEY: {{ .Values.vapid.privateKey | quote }}
{{- end }}
