apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ielts.fullname" . }}-test-connection
  labels:
    {{- include "ielts.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: {{ .Values.hymt.downloader.image }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command: ["sh", "-c"]
      args:
        - curl -fsS http://{{ include "ielts.fullname" . }}:{{ .Values.service.port }}/api/health | grep -q '"ok":true'
